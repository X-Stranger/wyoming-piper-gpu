name: Build Wyoming Piper GPU

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "OHF-Voice/wyoming-piper tag"
        required: true
        default: "v2.5.2"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            || true
          docker system prune -af || true
          df -h

      - name: Fetch upstream
        run: |
          git clone \
            --depth 1 \
            --branch "${{ inputs.upstream_tag }}" \
            https://github.com/OHF-Voice/wyoming-piper.git \
            upstream

      - name: Prepare metadata
        id: meta
        run: |
          VERSION="${{ inputs.upstream_tag }}"
          VERSION="${VERSION#v}"
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          SHA="$(git -C upstream rev-parse HEAD)"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER}/wyoming-piper-gpu" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          build-args: |
            ONNXRUNTIME_GPU_VERSION===1.24.4
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-gpu-r1
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}-r1
